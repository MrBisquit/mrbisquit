name: Generate Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: mrbisquit
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/London
          
          # Plugins
          plugin_languages: yes
          plugin_languages_ignored: >-
            html,
            css,
            ruby
          plugin_languages_details: bytes-size, lines, percentage
          plugin_languages_indepth: yes
          #plugin_languages_colors: github
          plugin_languages_limit: 16
          plugin_languages_sections: most-used
          
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          
          #plugin_languages_analysis_timeout: 15
          commits_authoring: >-
            William Dawson,
            mrbisquit,
            mrbisquit@users.noreply.github.com,
            william@wtdawson.info
          
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: false
          plugin_achievements_threshold: C

          plugin_followup: yes
          plugin_followup_sections: repositories, user

          plugin_lines: yes
          plugin_lines_history_limit: 6
          plugin_lines_repositories_limit: 32
          plugin_lines_sections: base

          plugin_code: yes
          plugin_code_days: 3
          plugin_code_lines: 12
          plugin_code_load: 400
          plugin_code_visibility: public
          
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
